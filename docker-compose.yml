version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: insightflow_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightflow_user} -d ${POSTGRES_DB:-insightflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightflow_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-InsightFlow AI}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-insightflow_user}:${POSTGRES_PASSWORD:-insightflow_password}@db:5432/${POSTGRES_DB:-insightflow_db}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightflow_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
